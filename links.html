<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car Photo Collector URLメモ</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #15171a;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 680px);
      background: #ffffff;
      border: 1px solid #d9dee7;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 24px;
      line-height: 1.3;
    }

    section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    a {
      color: #0b63ce;
      overflow-wrap: anywhere;
      font-weight: 600;
    }

    p {
      margin: 8px 0 0;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: 6px;
      background: #0b63ce;
      color: #ffffff;
      text-decoration: none;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        background: #111418;
        color: #eef2f7;
      }

      main {
        background: #181d24;
        border-color: #303844;
      }

      section {
        border-top-color: #303844;
      }

      a {
        color: #8ab8ff;
      }

      .button {
        background: #2f7df0;
        color: #ffffff;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Car Photo Collector URLメモ</h1>

    <section>
      <h2>アプリを開く</h2>
      <a href="./" class="button">Car Photo Collectorを開く</a>
      <p><a href="https://kys-code.github.io/car-photo-collector/">https://kys-code.github.io/car-photo-collector/</a></p>
    </section>

    <section>
      <h2>GitHubリポジトリ</h2>
      <p><a href="https://github.com/kys-code/car-photo-collector">https://github.com/kys-code/car-photo-collector</a></p>
    </section>

    <section>
      <h2>このURLメモページ</h2>
      <p><a href="https://kys-code.github.io/car-photo-collector/links.html">https://kys-code.github.io/car-photo-collector/links.html</a></p>
      <p>別PCやスマホからも、このページを開けばアプリURLを確認できます。</p>
    </section>
  </main>
</body>
</html>
